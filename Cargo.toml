[package]
name = "sink"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Minimal PipeWire audio control panel for Wayland"
license = "MIT"
repository = "https://github.com/sakuyma/sink"

[dependencies]
async-channel = "2"
gtk4 = { version = "0.11", features = ["v4_10"] }
pipewire = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
